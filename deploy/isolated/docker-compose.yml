# 独立实例：不占用默认 deploy 项目名/卷名，避免影响同机其它项目
# 使用：COMPOSE_PROJECT_NAME=tongyu_isolated docker compose -f docker-compose.yml up -d
#
# 【线上禁令】本文件可供对照，但发版包禁止覆盖服务器 deploy/isolated/docker-compose.yml 与 .env。
# 2026-10-25 晚起线上已与本示例对齐：项目名 isolated；镜像 tongyu-isolated:local；
# 卷 isolated_tongyu_isolated_pg / isolated_tongyu_isolated_uploads；库用户/库名 tongyu。
# 步骤见本机知识库：TongYuDesk/部署-客服机47.130 。
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tongyu
      POSTGRES_USER: tongyu
      POSTGRES_PASSWORD: tongyu
    # 不映射到宿主机 5432，避免和已有 Postgres 冲突
    volumes:
      - tongyu_isolated_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tongyu"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: tongyu-isolated:local
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tongyu:tongyu@postgres:5432/tongyu?sslmode=disable
      # 对外访问地址（按你反代端口改）；不要末尾斜杠
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://47.130.172.91:41815}
      WIDGET_TOKEN_SECRET: ${WIDGET_TOKEN_SECRET:-change-me-to-at-least-32-random-chars!!}
      WIDGET_TOKEN_TTL: 12h
      ALLOWED_ORIGIN: "*"
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@tongyu.local}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-TongYu@2026}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/uploads
    volumes:
      - tongyu_isolated_uploads:/data/uploads
    # 宿主机独立端口，不占 8080
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tongyu_isolated_pg:
  tongyu_isolated_uploads:
