services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: relaydesk
      POSTGRES_USER: relaydesk
      POSTGRES_PASSWORD: relaydesk
    ports:
      - "5432:5432"
    volumes:
      - relaydesk-postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaydesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://relaydesk:relaydesk@postgres:5432/relaydesk?sslmode=disable
      WIDGET_TOKEN_SECRET: local-only-change-this-secret-before-production
      WIDGET_TOKEN_TTL: 12h
      ALLOWED_ORIGIN: "*"
      DEMO_ENABLED: "true"
      PLATFORM_ADMIN_TOKEN: local-platform-admin-token
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/uploads
    volumes:
      - relaydesk-uploads:/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  relaydesk-postgres18:
  relaydesk-uploads:
