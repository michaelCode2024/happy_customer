services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tongyu
      POSTGRES_USER: tongyu
      POSTGRES_PASSWORD: tongyu
    ports:
      - "5432:5432"
    volumes:
      - tongyu-postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tongyu"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://tongyu:tongyu@postgres:5432/tongyu?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8080
      WIDGET_TOKEN_SECRET: local-only-change-this-secret-before-production
      WIDGET_TOKEN_TTL: 12h
      ALLOWED_ORIGIN: "*"
      DEMO_ENABLED: "true"
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@tongyu.local}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-TongYu@2026}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/uploads
    volumes:
      - tongyu-uploads:/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tongyu-postgres18:
  tongyu-uploads:
