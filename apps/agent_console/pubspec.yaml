name: tongyu_agent_console
description: TongYu cross-platform agent and operations console.
publish_to: none
# 与 web/pwa-release.json 同一发版号：名称取前三段，+ 后为去掉点的完整号。
version: 2026.11.09+2026110901

# One codebase, four shapes: the desktop build is what an agent sits in all day,
# the phone build is for on-call shifts, and the web build is a zero-install
# fallback. No Flutter Web build is used for the visitor widget — that stays a
# small Web Component so a customer site never pays for the framework.
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  uuid: ^4.5.1
  http: ^1.2.0
  web: ^1.1.0
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.3
  # 安卓安装包版本号。应用内下载后交给系统安装；网页仍用 url_launcher 打开下载页。
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  crypto: ^3.0.7
  # Pinned to the 0.8 line on purpose: the console must build against whatever
  # Flutter a developer already has, and image_picker 1.x requires Dart 3.10+.
  image_picker: ^0.8.9
  # Voice notes. Pinned to 0.9 because 0.10 reshuffled the platform packages;
  # windows is not among the platforms it implements, so the console guards
  # playback and falls back to a file chip there.
  just_audio: ^0.9.39
  record: ^7.1.2
  file_picker: ^8.0.7
  # Ctrl+V 粘贴截图：安装包用它读位图（Windows/macOS/Linux 开箱可用）。
  # 网页不走这个插件：浏览器要在 paste 事件里拿截图，见 clipboard_paste_web.dart。
  # 纯文本粘贴仍走 TextField 自带的 Clipboard 通道。
  # 停在 0.5.x：0.6.0 起要求 Flutter >=3.44，会把本项目的最低版本从 3.24 抬高。
  pasteboard: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  # CanvasKit 看不到系统中文；不进清单就会去 fonts.gstatic.com 拉 Noto，国内首屏闪方框。
  fonts:
    - family: SportsChinese
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
    # 彩色 emoji（选做）：CanvasKit 看不到系统字体，NotoSansSC 也不含 emoji，
    # 会话里出现的 😀 等会渲染成方框。需要时把 NotoColorEmoji.ttf 放进
    # assets/fonts/ 并取消下面注释。注意 CanvasKit 对 COLR/CPAL 彩色字体支持有限，
    # 可能仍降级；后端 SanitizeText 已剔除 PUA/U+FFFD 等“死码点”，是消除方框的主措施。
    # - family: "Noto Color Emoji"
    #   fonts:
    #     - asset: assets/fonts/NotoColorEmoji.ttf
  assets:
    - assets/images/service-illustrations.png
    - assets/images/ai-assistant.png
    - assets/images/knowledge-hero.png
    - assets/fonts/
