<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>语聊 · 群聊</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#1f2329;font:15px/1.6 system-ui,"Microsoft YaHei"}main{max-width:900px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:#f7f8fa}header{padding:16px 20px;background:white;border-bottom:1px solid #e9edf2;display:flex;align-items:center;gap:10px}h1{font-size:18px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.logo{border-radius:10px;background:#3370ff;color:white;width:36px;height:36px;display:grid;place-items:center}button{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:#edf2ff;color:#3370ff;font:inherit;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}input,textarea{font:inherit;border:1px solid #e4e7ec;border-radius:8px;padding:10px;min-width:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #3370ff;outline-offset:2px}#join{margin:auto;padding:28px;max-width:420px;background:white;border-radius:16px;box-shadow:0 8px 30px #182b4b0a}#join input{width:100%;margin:16px 0}#join button,.primary{background:#3370ff;color:white}#join button{width:100%}#chat{display:flex;flex-direction:column;flex:1;min-height:0}#announcement,#closed{padding:8px 16px;color:#646a73;font-size:13px}#closed{background:#fff5e5;color:#9b6100}#search{margin:8px 16px}#messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px}.message{max-width:85%;align-self:flex-start}.mine{align-self:flex-end}.meta{font-size:12px;color:#858d97;margin-bottom:5px}.bubble{background:white;border:1px solid #edf0f5;padding:10px 14px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:#e5edff;border:0}.recall{padding:3px 0;background:transparent;font-size:12px;color:#858d97;display:block;margin-left:auto}.tombstone{color:#858d97;font-size:13px}footer{display:flex;gap:10px;padding:12px 16px;background:white;padding-bottom:max(12px,env(safe-area-inset-bottom))}textarea{flex:1;resize:none}#error{color:#c03636;padding:8px 16px;background:#fff2f0}#status{font-size:12px;color:#646a73}[hidden]{display:none!important}dialog{border:1px solid #e4e7ec;border-radius:16px;width:min(440px,90vw);max-height:80dvh;overflow:auto;padding:24px;box-shadow:0 15px 60px #182b4b22}dialog::backdrop{background:#182b4b44}dialog h3{margin-top:0}dialog input{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.danger{color:#d74747;background:#fff0ef}.member{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.member small{display:block;color:#858d97}#older{margin:8px auto}#callCard{text-align:center}.avatar{width:72px;height:72px;margin:16px auto;border-radius:24px;display:grid;place-items:center;background:#edf2ff;color:#3370ff;font-size:32px}#callState{color:#646a73}#duration{color:#858d97;font-variant-numeric:tabular-nums}#callCard .actions{justify-content:center;flex-wrap:wrap}#dialogError{color:#c03636}#loading{padding:24px;color:#858d97;text-align:center}@media(max-width:500px){header{padding:12px;gap:6px}header button{padding:8px 10px}#status{display:none}#messages{padding:16px}footer{padding:10px}.logo{width:30px;height:30px}h1{font-size:16px}}
#conference{width:min(820px,96vw);background:#172131;color:#f7f9fd;max-height:94dvh}.roomAvatar{height:130px;display:grid;place-items:center;font-size:36px;color:#b9d0fa;background:radial-gradient(circle at center,#334969 0,#253449 70%)}#conference h3{margin-bottom:4px}#roomStatus{color:#b6c4da}#roomGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{background:#253449;border-radius:12px;overflow:hidden;position:relative;min-height:150px;display:flex;flex-direction:column}.tile video{width:100%;height:160px;object-fit:cover;background:#1e2b3d}.tile .tileLabel{padding:8px 10px;font-size:13px}.tile .tileStatus{padding:0 10px 8px;font-size:12px;color:#a9bfdc}#roomBanner{margin:8px 16px;padding:10px;background:#e7efff;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}#conference .actions{justify-content:center;flex-wrap:wrap}#callOptions .actions{justify-content:flex-start;flex-wrap:wrap}@media(max-width:500px){#roomGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile video{height:130px}#conference{padding:16px}.tile{min-height:140px}}
/* Light workbench styling. DOM IDs and interaction scripts stay unchanged. */
body{background:#F5F7FA;font-size:14px;color:#1F2329}
main{max-width:1100px;background:#fff;border-left:1px solid #E5E8EF;border-right:1px solid #E5E8EF}
header{min-height:56px;padding:10px 18px;border-color:#E5E8EF}
.logo{background:#2F6BFF;position:relative;font-size:0}
.logo:before{content:'';position:absolute;inset:7px 6px 9px;background:white;border-radius:8px}
.logo:after{content:'•••';position:relative;color:#2F6BFF;font-size:15px;letter-spacing:1px}
button{color:#2F6BFF;background:#E8F0FF;border-radius:6px;font-size:14px}
#join button,.primary{background:#2F6BFF;color:white}
input,textarea{border-color:#E5E8EF;border-radius:10px}
#join{border:1px solid #E5E8EF;border-radius:12px}
#announcement{margin:12px 16px 4px;padding:10px 14px;background:#EFF4FF;border:1px solid #DAE5FF;border-radius:8px;color:#1F2329}
#messages{gap:16px;padding:20px 24px;background:white}
.bubble{background:#F2F3F5;border:0;border-radius:12px;padding:12px 14px;color:#1F2329}
.mine .bubble{background:#E8F0FF}
.meta,.member small{color:#8F959E}
footer{margin:12px 16px;border:1px solid #E5E8EF;border-radius:12px;padding:12px}
footer textarea{border:0;background:white}#send{align-self:flex-end;min-width:72px}
.member{padding:10px 0;border-color:#E5E8EF}
#members{border-radius:12px}#members h3{font-size:16px}
@media(min-width:1000px){#members{position:fixed;margin:0 0 0 auto;inset:56px 0 0 auto;width:300px;height:calc(100dvh - 56px);max-height:none;border-radius:0;padding:20px}#members::backdrop{background:#1F232914}}
@media(max-width:600px){main{border:0}#messages{padding:16px}footer{margin:8px}header{padding:10px 12px}}

.member{flex-wrap:wrap}.member>span{flex:1;min-width:110px}
</style></head><body><main><header><span class="logo">聊</span><h1 id="title">客户服务群</h1><span id="status"></span><button id="callButton" hidden aria-label="语音与视频通话">通话</button><button id="people" hidden>成员</button><button id="settings" hidden aria-label="群聊设置">设置</button></header><div id="error" role="alert" hidden></div><div id="loading" hidden>正在打开群聊…</div><section id="join"><h2>加入客户服务群</h2><p>填写称呼，与客服一起沟通。已登录用户可由业务系统带入身份，无需重复注册。</p><input id="name" maxlength="120" placeholder="你的称呼" autocomplete="nickname"><button id="joinButton">加入群聊</button></section><section id="chat" hidden><div id="closed" hidden></div><div id="announcement" hidden></div><div id="roomBanner" hidden><span id="roomBannerText"></span><button id="joinRoom">加入通话</button></div><input id="search" type="search" placeholder="搜索群消息，回车查找" maxlength="64"><button id="older">加载更早消息</button><div id="messages" role="log" aria-live="polite"></div><footer><textarea id="draft" placeholder="发送群消息…" rows="2" maxlength="4000"></textarea><button id="send" class="primary">发送</button></footer></section></main>
<dialog id="members"><h3>群成员</h3><div id="memberList"></div><div class="actions"><button id="closeMembers">关闭</button><button id="leave" class="danger">退出群聊</button></div></dialog>
<dialog id="preferences"><h3>群聊设置</h3><label for="nickname">我的群昵称</label><p>新昵称用于此群中新发送的消息。</p><input id="nickname" maxlength="120" autocomplete="nickname"><section id="groupRules" hidden><h3>群规则</h3><label for="speakingMode">发言权限</label><select id="speakingMode"><option value="ALL">全员可发言</option><option value="MANAGERS">仅群主和管理员可发言</option></select><p><label for="maxMembers">群人数上限（2至5000）</label><input id="maxMembers" type="number" min="2" max="5000"></p><label><input id="requireIdentity" type="checkbox" style="width:auto">邀请入群必须登录商城</label><p><button id="saveGroupRules">保存群规则</button></p></section><section id="inviteSection" hidden><h3>邀请买家自愿加入</h3><button id="createInvite">生成邀请链接</button><p id="inviteResult" style="overflow-wrap:anywhere"></p></section><p id="dialogError" role="alert"></p><div class="actions"><button id="closeSettings">关闭</button><button id="saveNickname" class="primary">保存昵称</button><button id="dissolve" class="danger" hidden>解散群聊</button></div></dialog>
<dialog id="dissolveConfirm"><h3>解散群聊？</h3><p>所有成员将停止发送和通话，邀请立即失效。历史消息保留，解散后不能恢复。</p><p id="dissolveError" role="alert"></p><div class="actions"><button id="cancelDissolve">取消</button><button id="confirmDissolve" class="danger">确认解散</button></div></dialog>
<dialog id="callCard"><div class="avatar">☎</div><h3 id="callName">语音通话</h3><p id="callState" role="status"></p><p id="duration"></p><audio id="remoteAudio" autoplay playsinline></audio><div class="actions"><button id="acceptCall" class="primary" hidden>接听</button><button id="declineCall" class="danger" hidden>拒接</button><button id="muteCall" hidden>静音</button><button id="endCall" class="danger">挂断</button><button id="closeCall" hidden>关闭</button></div></dialog>
<dialog id="callOptions"><h3>发起通话</h3><p>邀请群成员一起沟通，最多 6 人。</p><label style="display:flex;gap:8px;align-items:center"><input id="videoWithCamera" type="checkbox" checked style="width:auto">视频通话时开启我的摄像头</label><div class="actions"><button id="startAudioRoom" class="primary">群语音通话</button><button id="startVideoRoom" class="primary">群视频通话</button><button id="privateCall">一对一语音</button><button id="closeOptions">取消</button></div></dialog>
<dialog id="conference"><h3 id="roomTitle">群通话</h3><p id="roomStatus" role="status">正在准备…</p><div id="roomGrid"></div><p id="roomError" role="alert"></p><div class="actions"><button id="roomMute">静音</button><button id="roomCamera">关闭摄像头</button><button id="roomLeave" class="danger">退出通话</button><button id="roomEnd" class="danger" hidden>结束所有人通话</button><button id="roomClose" hidden>关闭</button></div></dialog>
<script src="/group-interactions.js"></script><script src="/group-conference.js"></script></body></html>
