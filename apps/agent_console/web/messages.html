<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消息列表</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,"Microsoft YaHei";background:var(--rd-page,#f5f6f8);color:var(--rd-ink,#202b3d)}[hidden]{display:none!important}button{font:inherit;cursor:pointer}header{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--rd-header,#fff);min-height:48px}header strong{flex:1}header button{border:0;background:transparent;color:inherit;padding:8px}#list{padding:12px;display:flex;flex-direction:column;gap:10px}.item{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:14px;background:#fff;text-align:left;padding:14px 12px;color:inherit}.avatar{width:44px;height:44px;border-radius:14px;background:var(--rd-accent,#3263ff);color:var(--rd-accent-ink,#fff);display:grid;place-items:center;flex:none}.summary{flex:1;min-width:0}.summary strong,.summary small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.summary small{color:#727272;margin-top:5px}.meta{font-size:12px;color:#888;text-align:right}.badge{display:inline-block;border-radius:20px;padding:1px 6px;background:#ff7043;color:#fff;margin-top:6px}.kind{font-size:11px;color:#777;margin-left:5px}#state{padding:24px;text-align:center;color:#777}#detail{position:fixed;inset:0;display:flex;flex-direction:column;background:#fff;z-index:2}#detail iframe{flex:1;width:100%;border:0;min-height:0}#detail header{border-bottom:1px solid #eee}#widget{flex:1;min-height:0}#error{color:#b93838;padding:8px 14px}#refresh{white-space:nowrap}
</style></head><body>
<div id="error" role="alert" hidden><span id="errorText"></span><button id="retry">重试</button></div><div id="state" role="status">正在加载消息列表…</div><main id="list"></main>
<section id="detail" hidden><header><button id="back" aria-label="返回消息列表">‹ 返回</button><strong id="detailTitle"></strong></header><div id="widget" hidden></div><iframe id="thread" title="聊天详情" hidden allow="microphone;clipboard-write"></iframe></section>
<script src="/widget.js"></script><script src="messages.js"></script></body></html>
