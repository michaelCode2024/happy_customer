<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="通语工作台与平台运营后台">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="通语客服">


  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>通语客服</title>
  <link rel="manifest" href="manifest.json">
  <!-- HTML 渲染器下由浏览器绘制中文；避免缺字变成方框 -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
        "Noto Sans SC", "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <script>
    // Flutter 离线缓存可能锁住旧的引导文件，导致拿不到新版 worker 的版本号。
    // 引导文件每次从网络检查，业务资源仍由新版 worker 按内容哈希缓存。
    const bootstrap = document.createElement('script');
    bootstrap.src = 'flutter_bootstrap.js?release=' + Date.now();
    bootstrap.async = true;
    document.body.appendChild(bootstrap);
  </script>
</body>
</html>
