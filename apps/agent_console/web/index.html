<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 工作台唯一入口：本页加载 Flutter。禁止再跳转到 desktop.html / mobile.html。 -->
  <!-- 本机自托管字体；禁止再引外网字体 CDN，避免国内网络卡住首屏。 -->
  <link rel="stylesheet" href="fonts.css">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="通语工作台与平台运营后台">

  <!-- iOS meta tags & icons -->
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="通语客服">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">


  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>通语客服</title>
  <link rel="manifest" href="manifest.json">
  <!-- HTML 渲染器下由浏览器绘制中文；避免缺字变成方框 -->
  <style>
    html, body {
      margin: 0;
      background-color: var(--tongyu-page-bg, #ffffff);
      height: 100%;
      font-family: "Plus Jakarta Sans", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
        "Noto Sans SC", "Segoe UI", sans-serif;
    }

    #tongyu-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--tongyu-page-bg,#fff);color:inherit;z-index:99999;opacity:1;transition:opacity .22s ease;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
    #tongyu-loading.leaving{opacity:0;pointer-events:none}
    .tongyu-start-identity{text-align:center;padding:24px;transform:translateY(-20px)}
    .tongyu-start-icon{position:relative;display:grid;place-items:center;width:108px;height:108px;margin:0 auto 18px}
    .tongyu-start-icon:before{content:'';position:absolute;inset:7px;border-radius:30px;background:#f8f9fc;transform:rotate(-9deg)}
    [data-tongyu-theme="dark"] .tongyu-start-icon:before{background:#202632}
    .tongyu-start-icon svg{position:relative;animation:tongyu-breathe 2.8s ease-in-out infinite}
    .tongyu-start-title{font-size:28px;letter-spacing:4px;line-height:1.4;margin:0 0 9px;font-weight:650}
    .tongyu-start-english{font-size:10px;letter-spacing:4px;opacity:.55;margin:0 0 29px;padding-left:4px}
    .tongyu-start-tagline{font-size:13px;letter-spacing:1px;opacity:.65;margin:0}
    .tongyu-start-activity{position:relative;overflow:hidden;width:70px;height:3px;background:#edf0f6;border-radius:8px;margin:34px auto 0}
    .tongyu-start-activity:after{content:'';display:block;width:26px;height:100%;border-radius:8px;background:#3263ff;animation:tongyu-travel 1.7s ease-in-out infinite}
    .tongyu-start-foot{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:20px;right:20px;text-align:center;font-size:10px;letter-spacing:2px;opacity:.45}
    .tongyu-start-status{font-size:12px;line-height:1.9;opacity:.7;max-width:280px;margin:22px auto 0}
    #tongyu-load-retry{display:block;margin:16px auto 0;border:0;border-radius:9px;background:#3263ff;color:#fff;font:14px inherit;padding:12px 28px;cursor:pointer}
    @keyframes tongyu-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes tongyu-travel{0%,100%{transform:translateX(-28px)}50%{transform:translateX(44px)}}
    @media(prefers-reduced-motion:reduce){#tongyu-loading,.tongyu-start-icon svg,.tongyu-start-activity:after{animation:none;transition:none}}
  </style>
  <script>
    // Flutter 全屏网页引擎会重建 viewport，保留 cover 才能读取苹果底部安全距离。
    function retainSafeViewport() {
      const meta = document.querySelector('meta[name="viewport"]');
      if (meta && !meta.content.includes('viewport-fit=cover')) meta.content += ', viewport-fit=cover';
    }
    new MutationObserver(retainSafeViewport).observe(document.head,
        {childList:true,subtree:true,attributes:true,attributeFilter:['content']});
    retainSafeViewport();
    // 首帧前读取已保存的外观，避免深色登录页与白色网页安全区域拼接。
    window.tongyuSyncTheme = function(color, dark) {
      if (!/^#[0-9a-f]{6}$/i.test(color)) return;
      const root = document.documentElement;
      root.style.setProperty('--tongyu-page-bg', color);
      root.style.backgroundColor = color;
      root.dataset.tongyuTheme = dark ? 'dark' : 'light';
      root.style.colorScheme = dark ? 'dark' : 'light';
      root.style.color = dark ? '#e2e8f0' : '#425466';
      document.querySelector('meta[name="theme-color"]').content = color;
      document.querySelector('meta[name="color-scheme"]').content = dark ? 'dark' : 'light';
      if (document.body) document.body.style.backgroundColor = color;
      const loading = document.getElementById('tongyu-loading');
      if (loading) { loading.style.backgroundColor = color; loading.style.color = dark ? '#e2e8f0' : '#425466'; }
    };
    // Product is light-theme only; ignore OS preference and any legacy dark preference.
    try { localStorage.setItem('flutter.tongyu.themeMode', JSON.stringify('light')); } catch (_) {}
    window.tongyuSyncTheme('#ffffff', false);
  </script>
</head>
<body>
  <!-- 主脚本下载期间给出明确反馈，首帧绘制后移除。 -->
  <div id="tongyu-loading" role="status" aria-label="正在打开通语">
    <div class="tongyu-start-identity"><div class="tongyu-start-icon"><svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" viewBox="0 0 40 40"><defs><linearGradient id="brand-blue" x1="8" y1="6" x2="34" y2="31" gradientUnits="userSpaceOnUse"><stop stop-color="#6087ff"/><stop offset=".48" stop-color="#3765ff"/><stop offset="1" stop-color="#2450ed"/></linearGradient><linearGradient id="brand-light" x1="7" y1="14" x2="24" y2="30" gradientUnits="userSpaceOnUse"><stop stop-color="#d8e8ff"/><stop offset="1" stop-color="#7ea8ff"/></linearGradient></defs><path d="M5 20C5 10.6 12.6 4 22 4c9.2 0 16 6.2 16 14.5S31.2 33 22.5 33H14L7.4 38C6.3 38.8 5 38 5 36.7Z" fill="url(#brand-blue)"/><path d="M5 22c0-5.9 4.1-10 9.4-10 6.2 0 10.6 4.4 10.6 10 0 5.3-4.2 9.5-9.7 9.5C9.5 31.5 5 27.8 5 22Z" fill="url(#brand-light)"/><path d="M5 22c0 4.3 2.8 7.5 6.3 8.8L7.4 38C6.3 38.8 5 38 5 36.7Z" fill="#3765ff"/></svg>

</div><h1 class="tongyu-start-title">通语</h1><p class="tongyu-start-english">TONGYU</p><p class="tongyu-start-tagline">让每一次咨询，都有回应。</p><div class="tongyu-start-activity" aria-hidden="true"></div><div class="tongyu-start-status" id="tongyu-start-status"></div></div><div class="tongyu-start-foot">客户服务 · 从容有序</div>
  </div>
  <script>
    function dismissTongyuSplash() {
      // First Flutter frame is enough to leave the HTML splash; app-ready may lag on slow bootstrap.
      if (!window.tongyuFirstFramePainted) return;
      window.tongyuFirstFrameReady = true;
      const splash = document.getElementById('tongyu-loading');
      if (!splash) return;
      splash.classList.add('leaving');
      splash.style.pointerEvents = 'none';
      splash.setAttribute('aria-hidden', 'true');
      const remove = function () {
        try { splash.remove(); } catch (_) {}
      };
      // Always remove; reduced-motion and normal path both clear the overlay.
      setTimeout(remove, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 220);
      // Belt-and-suspenders: if the transition path stalls, force-remove.
      setTimeout(remove, 800);
    }
    window.addEventListener('flutter-first-frame', () => {
      window.tongyuFirstFramePainted = true; dismissTongyuSplash();
    });
    window.addEventListener('tongyu-app-ready', () => {
      window.tongyuAppReady = true; dismissTongyuSplash();
    });
  </script>
  <script>
    // Keep splash dismiss and failure retry deterministic for local web-server preview.
    window.tongyuEnsureRetry = function (label) {
      const status = document.getElementById('tongyu-start-status');
      if (!status) return;
      let retry = document.getElementById('tongyu-load-retry');
      if (!retry) {
        retry = document.createElement('button');
        retry.id = 'tongyu-load-retry';
        retry.type = 'button';
        retry.setAttribute('aria-label', '重新打开通语');
        retry.onclick = function () {
          try { sessionStorage.setItem('tongyu.manualReload', '1'); } catch (_) {}
          location.reload();
        };
        status.appendChild(retry);
      }
      retry.textContent = label || '重新加载';
    };
    window.tongyuLoadingFailed = function () {
      if (window.tongyuFirstFrameReady) return;
      const loading = document.getElementById('tongyu-loading');
      if (!loading) return;
      loading.querySelector('.tongyu-start-activity')?.remove();
      const status = document.getElementById('tongyu-start-status');
      if (!status) return;
      status.setAttribute('role', 'alert');
      status.textContent = '暂时无法打开通语，请检查网络后重试。';
      window.tongyuEnsureRetry('重新加载');
    };
    function tongyuAppendBootstrap(src) {
      // Fetch first so we never execute an HTML error/SPA fallback as JavaScript (MIME text/html).
      const el = document.createElement('script');
      el.type = 'text/javascript';
      fetch(src, { cache: 'no-cache', credentials: 'same-origin' }).then(function (res) {
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        if (!res.ok || ct.indexOf('html') >= 0) {
          throw new Error('bootstrap not javascript: ' + res.status + ' ' + ct);
        }
        return res.text();
      }).then(function (code) {
        el.text = code;
        document.body.appendChild(el);
      }).catch(function () {
        el.src = src;
        el.async = true;
        el.onerror = window.tongyuLoadingFailed;
        document.body.appendChild(el);
      });
      return el;
    }
    // DWDS/web-server may load modules but never invoke main without a debug extension.
    window.tongyuKickstartMain = function () {
      if (window.tongyuFirstFramePainted || window.tongyuFirstFrameReady) return true;
      try {
        if (typeof window.$dartRunMain === 'function') { window.$dartRunMain(); return true; }
        if (window.$dartMainTearOffs && typeof window.$dartMainTearOffs.main === 'function') {
          window.$dartMainTearOffs.main();
          return true;
        }
      } catch (_) {}
      return false;
    };
    (function () {
      var tries = 0;
      var timer = setInterval(function () {
        tries += 1;
        window.tongyuKickstartMain();
        // If Flutter view mounted but splash flags lagged, treat as first frame.
        if (!window.tongyuFirstFramePainted && document.querySelector('flutter-view, flt-glass-pane, canvas')) {
          window.tongyuFirstFramePainted = true;
          dismissTongyuSplash();
        }
        if (window.tongyuFirstFramePainted || window.tongyuFirstFrameReady) {
          clearInterval(timer);
          return;
        }
        if (tries > 150) clearInterval(timer);
      }, 400);
    })();
    tongyuAppendBootstrap('flutter_bootstrap.js');
    setTimeout(function () {
      if (window.tongyuFirstFrameReady || document.getElementById('tongyu-load-retry')) return;
      window.tongyuKickstartMain();
      const status = document.getElementById('tongyu-start-status');
      if (status) {
        status.textContent = '连接时间较长，请检查网络。正在继续尝试连接…';
        window.tongyuEnsureRetry('重试打开');
      }
    }, 8000);
    setTimeout(function () {
      if (window.tongyuFirstFrameReady) return;
      window.tongyuKickstartMain();
      // 只在第一次脚本没跑起来时软重试。解析到一半再注入会重复声明变量。
      if (!window.tongyuBootstrapRetried) {
        window.tongyuBootstrapRetried = true;
        if (window.__tongyuBootstrapApplied) {
          return;
        }
        tongyuAppendBootstrap('flutter_bootstrap.js?retry=' + Date.now());
        return;
      }
      window.tongyuLoadingFailed();
    }, 22000);
    setTimeout(function () {
      if (!window.tongyuFirstFrameReady) window.tongyuLoadingFailed();
    }, 45000);
  </script>
  <script src="pwa-client.js"></script>
  <script src="push-client.js"></script>
</body>
</html>
