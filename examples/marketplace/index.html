<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaaS 完整页面接入联调</title>
<style>body{margin:0;font:15px system-ui;background:#f4f6f9}header{padding:12px;background:white}button,select{font:inherit;padding:8px;margin:4px}iframe{width:100%;height:calc(100vh - 120px);border:0}#error{color:#b22}</style>
<header>本机模拟商城身份 · 聊天界面全部来自 SaaS <select id="role"><option value="buyer">买家</option><option value="staff-a">店铺A店主</option><option value="staff-b">店铺B店主</option></select><button id="login">进入</button><span id="contacts" hidden><button data-shop="a">联系店铺A</button><button data-shop="b">联系店铺B</button><button id="group">自愿加入福利群</button></span><span id="error"></span></header><main id="host"></main>
<script>
let session,ticket,frame,currentShop='a';
const $=id=>document.getElementById(id),report=e=>$('error').textContent=e.message;
async function local(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await r.json();if(!r.ok)throw Error(data.message);return data}
function sendIdentity(){if(frame&&ticket)frame.contentWindow.postMessage(JSON.stringify({type:'authenticate',identityToken:ticket}),new URL(session.endpoint).origin)}
function mount(url,token){ticket=token;frame=document.createElement('iframe');frame.allow='microphone; camera';const src=new URL(url);src.searchParams.set('parentOrigin',location.origin);frame.src=src;frame.onload=()=>{$('error').textContent='完整页面已加载';sendIdentity()};$('host').replaceChildren(frame)}
window.addEventListener('message',event=>{if(!frame||event.source!==frame.contentWindow||event.origin!==new URL(session.endpoint).origin)return;const data=typeof event.data==='string'?JSON.parse(event.data):event.data;if(data?.source!=='relaydesk')return;if(data.type==='host-ready'){$('error').textContent='身份桥已就绪';sendIdentity()};if(data.type==='close'){$('host').replaceChildren();frame=null;ticket=null}});
$('login').onclick=async()=>{try{$('error').textContent='';const role=$('role').value;session=await local('/api/login',{role:role==='buyer'?'buyer':'staff',shop:role.split('-')[1]||'a'});$('contacts').hidden=session.role!=='buyer';if(session.role==='staff')mount(session.endpoint+'/console/?embedded=1',session.token);else $('host').replaceChildren()}catch(e){report(e)}};
for(const b of document.querySelectorAll('[data-shop]'))b.onclick=async()=>{try{currentShop=b.dataset.shop;const r=await fetch(session.endpoint+'/api/v1/marketplace/buyer/shops/'+currentShop+'/session',{method:'POST',headers:{Authorization:'Bearer '+session.token,'Content-Type':'application/json'},body:'{}'}),data=await r.json();if(!r.ok)throw Error(data.message);mount(session.endpoint+'/h5/'+encodeURIComponent(data.inboxKey)+'?source=APP',data.identityToken)}catch(e){report(e)}};
$('group').onclick=async()=>{try{const data=await local('/api/group',{shop:currentShop,consent:true});frame=document.createElement('iframe');frame.src=data.endpoint+'/groups.html?groupId='+encodeURIComponent(data.groupId)+'&embed=1&parentOrigin='+encodeURIComponent(location.origin);frame.onload=()=>frame.contentWindow.postMessage({type:'relaydesk.group.authenticate',groupId:data.groupId,token:data.token},new URL(data.endpoint).origin);$('host').replaceChildren(frame)}catch(e){report(e)}};
</script></html>
